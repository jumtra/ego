[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ego"
version = "0.0.54"
description = "CLI-first self-evolving coding harness with offline testing and optional agent integrations"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]
authors = [{name="Ego Community"}]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.0", "PyYAML>=6"]

[project.scripts]
ego = "ego.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ego = ["defaults.toml", "pricing.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
